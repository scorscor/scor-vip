version: '3.8'

services:
  web:
    build: .
    ports:
      - "5003:5003"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/portfolio.db}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PORT=${PORT:-5003}
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
