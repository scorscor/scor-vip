services:
  mail-api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - mail-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  mail-data:
