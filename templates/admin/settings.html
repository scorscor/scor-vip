{% extends "admin/admin_base.html" %}

{% block title %}设置{% endblock %}

{% set unread_count = 0 %}

{% block content %}
<div class="mb-6">
    <h2 class="text-3xl font-bold text-gray-800">系统设置</h2>
    <p class="text-gray-600 mt-1">修改管理员密码</p>
</div>

<div class="bg-white rounded-lg shadow p-8 max-w-xl">
    <form method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">新密码</label>
            <input type="password" name="new_password"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="留空则不修改">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">确认密码</label>
            <input type="password" name="confirm_password"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="再次输入新密码">
        </div>

        <div class="flex gap-4 pt-4">
            <button type="submit"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                保存修改
            </button>
        </div>
    </form>
</div>

<div class="mt-8 bg-white rounded-lg shadow p-8 max-w-xl">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">当前账号</h3>
    <div class="space-y-2">
        <p class="text-sm text-gray-600">用户名：<span class="font-medium">{{ session.get('username') }}</span></p>
        <p class="text-sm text-gray-600">提示：如需修改用户名，请联系管理员</p>
    </div>
</div>
{% endblock %}
