{% extends "admin/admin_base.html" %}

{% block title %}{{ '编辑' if skill else '添加' }}技能{% endblock %}

{% set unread_count = 0 %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('admin.skills') }}" class="text-blue-600 hover:text-blue-800 text-sm mb-2 inline-block">
        &larr; 返回列表
    </a>
    <h2 class="text-3xl font-bold text-gray-800">{{ '编辑' if skill else '添加' }}技能</h2>
</div>

<div class="bg-white rounded-lg shadow p-8 max-w-xl">
    <form method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">技能名称 *</label>
            <input type="text" name="name" value="{{ skill.name if skill else '' }}" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="例如：Figma">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">分类 *</label>
            <select name="category" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">选择分类</option>
                <option value="design" {% if skill and skill.category == 'design' %}selected{% endif %}>设计</option>
                <option value="development" {% if skill and skill.category == 'development' %}selected{% endif %}>开发</option>
                <option value="soft" {% if skill and skill.category == 'soft' %}selected{% endif %}>软技能</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">排序</label>
            <input type="number" name="order" value="{{ skill.order if skill else 0 }}"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <div class="flex gap-4 pt-4">
            <button type="submit"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                {{ '保存' if skill else '添加' }}
            </button>
            <a href="{{ url_for('admin.skills') }}"
                class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition-colors">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}
