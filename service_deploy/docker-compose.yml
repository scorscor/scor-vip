services:
  web:
    image: ghcr.io/scorscor/scor-vip:main
    container_name: scor-vip
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/instance/portfolio.db}
      FLASK_ENV: ${FLASK_ENV:-production}
      PORT: ${PORT:-5003}
      APP_DOMAIN: ${APP_DOMAIN:-https://scor.vip}
    ports:
      - "127.0.0.1:5003:5003"
    volumes:
      - scor-vip-data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  scor-vip-data:
